name: returnbase

x-rails: &rails
  build: .
  image: returnbase-rails
  working_dir: /app
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    HOME: /tmp
    DB_HOST: db
    SMTP_HOST: mailpit
    ADMIN_PASSWORD: returnbase-admin
    DEMO_RESET_PASSWORD: ${DEMO_RESET_PASSWORD:-returnbase-admin}
    SHIPPING_CALLBACK_TOKEN: dev-shipping-token
  volumes:
    - .:/app
    - gems:/usr/local/bundle

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  api:
    <<: *rails
    command: sh -c "bundle check || bundle install; rm -f /tmp/server.pid; bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3100 -P /tmp/server.pid"
    ports:
      - "3100:3100"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3100/api/health"]
      interval: 5s
      retries: 60
      start_period: 30s

  worker:
    <<: *rails
    command: bin/jobs
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "solid-queue"]
      interval: 5s
      retries: 20

  web:
    build: ./web
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      WEB_WATCH_POLLING: ${WEB_WATCH_POLLING:-0}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5180:5180"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5180/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 60
      start_period: 30s

  vendors:
    build: ./vendors
    command: bundle exec rackup -s puma -o 0.0.0.0 -p 4100
    volumes:
      - ./vendors:/app
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4100/health"]
      interval: 5s
      retries: 20

  shipping:
    build: ./shipping
    command: bundle exec rackup -s puma -o 0.0.0.0 -p 4300
    environment:
      VENDORS_URL: http://vendors:4100
      SHIPPING_CALLBACK_TOKEN: dev-shipping-token
    volumes:
      - ./shipping:/app
    ports:
      - "4300:4300"
    depends_on:
      vendors:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4300/health"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    environment:
      MP_UI_BIND_ADDR: 0.0.0.0:8125
    ports:
      - "8125:8125"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  gems:
  web_node_modules:
